<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6A7C1" />
    <!-- Favicon (D82): el mismo rostro sonriente de Mini Marie que el logo del encabezado. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <meta name="description" content="Reconoce tu Barrio: El Tintal, Kennedy, Bogotá D.C." />
    <!-- Soria es la letra de todo el texto (D98): se pide ya, sin esperar al CSS. Y las dos que pintan
         el LCP medido: Anton (el titular, a 1440 px) y Cormorant 500 cursiva (la bajada, en el celular).
         Vite les pone el mismo nombre con hash que en la hoja de @fontsource: una sola descarga. -->
    <link rel="preload" href="/assets/fonts/soria/soria.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
    <title>Reconoce tu Barrio · El Tintal</title>
    <!-- Pantalla de carga (H33, D111): el atlas que comparten sus dos Mini Marie se pide al leer la
         página, no cuando React la pinta. El de 420 px si la pantalla da para ese alto (LOADER_WIDE)
         o es más densa que 1,01 dppx; si no, el de 210. Misma elección que LoadingScreen (loaderAtlas,
         con los umbrales de SequenceSprite); las formas -webkit- son para Safari antes del 16. -->
    <link rel="preload" as="image" type="image/webp" href="/assets/avatar/run/run_420.webp" media="(min-width: 640px) and (min-height: 860px), (min-resolution: 1.01dppx), (-webkit-min-device-pixel-ratio: 1.01)" />
    <link rel="preload" as="image" type="image/webp" href="/assets/avatar/run/run_210.webp" media="(max-width: 639.98px) and (max-resolution: 1.009dppx), (max-height: 859.98px) and (max-resolution: 1.009dppx), (max-width: 639.98px) and (-webkit-max-device-pixel-ratio: 1.009), (max-height: 859.98px) and (-webkit-max-device-pixel-ratio: 1.009)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
